<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mapa Ibagué - Fundación Reaching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .leaflet-container { font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Inicializar mapa centrado en Ibagué
    const map = L.map('map').setView([4.4389, -75.2322], 12);

    // Base OSM
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    // Cargar comunas
    fetch('./data/ibague_urbano.geojson')
      .then(r => r.json())
      .then(geo => L.geoJSON(geo, {
        style: { color: '#0a6dc2', weight: 1, fillOpacity: 0.2 }
      }).bindPopup(f => `<b>Comuna:</b> ${f.properties.nombre || 's/d'}`).addTo(map))
      .catch(err => console.error('Error comunas:', err));

    // Cargar corregimientos
    fetch('./data/ibague_corregimientos.geojson')
      .then(r => r.json())
      .then(geo => L.geoJSON(geo, {
        style: { color: '#ff8800', weight: 1, fillOpacity: 0.15 }
      }).bindPopup(f => `<b>Corregimiento:</b> ${f.properties.nombre || 's/d'}`).addTo(map))
      .catch(err => console.error('Error corregimientos:', err));
  </script>
</body>
</html>
