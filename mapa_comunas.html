<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(async () => {
  // 1) Cargar datos
  const barriosGeo = await fetch('./data/ibague_barrios.geojson').then(r=>r.json());
  const poblacion = await d3.csv('./data/ibague_barrios_poblacion.csv', d => ({
    barrio: (d.barrio || '').trim().toUpperCase(),     // normaliza nombres
    poblacion: +d.poblacion || 0,
    comuna: (d.comuna || '').trim()
  }));

  // 2) Indexar CSV por nombre de barrio
  const byBarrio = new Map(poblacion.map(d => [d.barrio, d]));

  // 3) Enriquecer features con población
  barriosGeo.features.forEach(f => {
    const nombre = ((f.properties.BARRIO || f.properties.nombre || '') + '').trim().toUpperCase();
    const match = byBarrio.get(nombre);
    f.properties.poblacion = match ? match.poblacion : null;
    f.properties.comuna = match ? match.comuna : null;
  });

  // 4) Pintar en Leaflet con coropletas simples
  function color(p) {
    if (p == null) return '#cccccc';
    return p > 15000 ? '#084081' :
           p > 10000 ? '#0868ac' :
           p >  6000 ? '#2b8cbe' :
           p >  3000 ? '#4eb3d3' :
           p >  1500 ? '#7bccc4' : '#a8ddb5';
  }

  const capa = L.geoJSON(barriosGeo, {
    style: f => ({
      color: '#1d3557',
      weight: 0.7,
      fillColor: color(f.properties.poblacion),
      fillOpacity: 0.6
    }),
    onEachFeature: (f, layer) => {
      const n = f.properties.BARRIO || f.properties.nombre || 'Barrio';
      const p = f.properties.poblacion ?? 's/d';
      const c = f.properties.comuna ?? '—';
      layer.bindPopup(`<b>${n}</b><br/>Población: ${p.toLocaleString('es-CO')}<br/>Comuna: ${c}`);
    }
  }).addTo(map);

  // 5) Leyenda rápida (opcional)
  const legend = L.control({position:'bottomright'});
  legend.onAdd = function() {
    const div = L.DomUtil.create('div','legend');
    const breaks = [0,1500,3000,6000,10000,15000];
    let html = '<div style="background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font:12px system-ui">';
    html += '<b>Población</b><br>';
    for (let i=0;i<breaks.length;i++){
      const from = breaks[i], to = breaks[i+1];
      html += `<i style="display:inline-block;width:12px;height:12px;margin-right:6px;background:${color(to||from+1)}"></i>`;
      html += to ? `${from.toLocaleString('es-CO')}–${to.toLocaleString('es-CO')}<br>` : `>${from.toLocaleString('es-CO')}<br>`;
    }
    html += '</div>';
    div.innerHTML = html;
    return div;
  };
  legend.addTo(map);
})();
</script>
