<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de Ibagué – Fundación Reaching</title>
  <meta name="description" content="Mapa interactivo de Ibagué (comunas, corregimientos, municipios y departamento) con búsqueda, censo poblacional, compartir por enlace y polígono del Tolima." />
  <link rel="preconnect" href="https://{s}.tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    :root{ --brand:#0ea5e9; --bg:#0b1220; --panel:#0f172a; --text:#e2e8f0; --muted:#94a3b8; }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,sans-serif}
    #app{display:flex;flex-direction:column;height:100%}
    header{position:sticky;top:0;z-index:1000;background:linear-gradient(to right,rgba(2,6,23,.9),rgba(2,6,23,.7));border-bottom:1px solid rgba(148,163,184,.2);backdrop-filter:blur(6px)}
    .wrap{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.6rem .9rem}
    .brand{display:flex;align-items:center;gap:.6rem;font-weight:700}
    .brand .dot{width:.9rem;height:.9rem;border-radius:999px;background:var(--brand)}
    .brand a{color:var(--text);text-decoration:none}
    #panel{background:var(--panel);border-bottom:1px solid rgba(148,163,184,.2)}
    #panel.collapsed{display:none}
    .panel-inner{display:grid;gap:.75rem;padding:.75rem}
    .search{position:relative}
    .search input{width:100%;padding:.6rem .75rem;border-radius:.6rem;background:#0b1220;border:1px solid rgba(148,163,184,.3);color:var(--text)}
    .suggest{position:absolute;top:100%;left:0;right:0;background:#0b1220;border:1px solid rgba(148,163,184,.3);max-height:240px;overflow:auto}
    .suggest div{padding:.5rem .75rem;cursor:pointer}
    .suggest div:hover{background:#0f172a}
    .badge{display:inline-flex;gap:.4rem;align-items:center;padding:.35rem .55rem;border-radius:999px;border:1px solid rgba(148,163,184,.3);font-size:.85rem;color:var(--muted)}
    .badge input{accent-color:var(--brand)}
    .cta-row{display:flex;gap:.5rem;flex-wrap:wrap}
    button{appearance:none;border:1px solid rgba(148,163,184,.35);background:transparent;color:var(--text);padding:.55rem .8rem;border-radius:.7rem;cursor:pointer;font-weight:600}
    button:hover{border-color:var(--brand)}
    #map{flex:1}
    footer{font-size:.85rem;color:var(--muted);padding:.5rem .9rem;border-top:1px solid rgba(148,163,184,.2);background:#0b1220}
    .infobox{position:fixed;right:12px;bottom:12px;z-index:1200;max-width:360px;background:#0b1220;border:1px solid rgba(148,163,184,.3);border-radius:12px;box-shadow:0 10px 35px rgba(0,0,0,.35)}
    .infobox header{display:flex;justify-content:space-between;padding:.6rem .8rem;border-bottom:1px solid rgba(148,163,184,.15)}
    .infobox .body{padding:.75rem .9rem}
    .muted{color:#94a3b8}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="wrap">
      <div class="brand"><span class="dot"></span><a href="/">Fundación Reaching</a><span style="opacity:.7">·</span>Mapa de Ibagué</div>
      <button id="toggle">Controles</button>
    </div>
  </header>

  <section id="panel">
    <div class="panel-inner">
      <div class="search">
        <label for="q">Búsqueda</label>
        <input id="q" type="search" placeholder="Comuna, corregimiento, municipio…"/>
        <div id="suggest" class="suggest" hidden></div>
      </div>
      <div class="cta-row">
        <button id="btnComunas">📍 Comunas</button>
        <button id="btnCorreg">🏞️ Corregimientos</button>
        <button id="btnMunicipios">🏘️ Municipios</button>
        <button id="btnDeptoBtn">🗺️ Departamento</button>
        <button id="btnShare">🔗 Compartir</button>
        <button id="btnReset">⟳ Restablecer</button>
      </div>
    </div>
  </section>

  <div id="map"></div>
  <div id="infobox" class="infobox" hidden>
    <header><h4 id="infoTitle">Información</h4><button id="infoClose">✕</button></header>
    <div class="body" id="infoBody"></div>
  </div>

  <footer>Datos desde <code>datos/*.json</code> o <code>data/*.json</code> · “Todo lo que hagáis, hacedlo de corazón” (Col 3:23)</footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
  const $ = s=>document.querySelector(s);
  const initialView={lat:4.4389,lng:-75.2320,zoom:12};
  const map=L.map('map').setView([initialView.lat,initialView.lng],initialView.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

  let dataset={comunas:[],corregimientos:[],municipios:[]};
  async function fetchJSON(url){const r=await fetch(url);if(!r.ok) throw new Error(r.status);return r.json();}

  const inlineSample={
    comunas:[{nombre:'Comuna 1 - Centro',lat:4.4389,lng:-75.2320,pob:31009}],
    corregimientos:[{nombre:'San Juan de la China',lat:4.53333,lng:-75.20000,pob:2000}],
    municipios:[{nombre:'Ibagué',lat:4.4389,lng:-75.2320,pob:498401}]
  };

  function markerFor(item,type){const color=type==='Comuna'?'#22c55e':type==='Corregimiento'?'#f59e0b':'#60a5fa';return L.circleMarker([item.lat,item.lng],{radius:Math.max(6,Math.min(30,Math.sqrt(item.pob||0)/2)),color,fillOpacity:.5}).bindPopup(`<b>${item.nombre}</b><br>${type}<br>Población: ${(item.pob||0).toLocaleString('es-CO')}`)}

  function render(){
    L.layerGroup(dataset.comunas.map(x=>markerFor(x,'Comuna'))).addTo(map);
    L.layerGroup(dataset.corregimientos.map(x=>markerFor(x,'Corregimiento'))).addTo(map);
    L.layerGroup(dataset.municipios.map(x=>markerFor(x,'Municipio'))).addTo(map);
  }

  function sumPob(items){return items.reduce((a,b)=>a+(b.pob||0),0)}
  function stats(title,items){const total=items.length,pob=sumPob(items);$('#infoTitle').textContent=title;$('#infoBody').innerHTML=`<p>Total: ${total}</p><p>Población: ${pob.toLocaleString('es-CO')}</p>`;$('#infobox').hidden=false;}

  $('#btnComunas').onclick=()=>stats('Comunas de Ibagué',dataset.comunas);
  $('#btnCorreg').onclick=()=>stats('Corregimientos de Ibagué',dataset.corregimientos);
  $('#btnMunicipios').onclick=()=>stats('Municipios del Tolima',dataset.municipios);
  $('#btnDeptoBtn').onclick=()=>stats('Departamento del Tolima',[...dataset.comunas,...dataset.corregimientos,...dataset.municipios]);
  $('#infoClose').onclick=()=>$('#infobox').hidden=true;

  async function load(){
    try{dataset=await fetchJSON('datos/ibague.json');}catch(e){dataset=inlineSample;}
    render();
  }
  load();
})();
</script>
</body>
</html>
