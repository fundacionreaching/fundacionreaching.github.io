<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validador /data · Fundación Reaching</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="max-w-3xl mx-auto p-4">
    <h1 class="text-xl font-black">Validador de archivos /data</h1>
    <p class="text-sm text-slate-600 mb-4">Comprueba si los archivos existen y son accesibles desde GitHub Pages.</p>
    <div id="result" class="space-y-2"></div>
  </main>

<script>
const FILES = [
  '/data/dane_tolima_poblacion.csv',
  '/data/tolima_municipios.geojson',
  '/data/ibague_comunas.geojson',
  '/data/ibague_comunas_poblacion.csv',
  '/data/ibague_corregimientos.geojson',
  '/data/ibague_corregimientos_poblacion.csv',
  '/data/ibague_veredas.geojson',
  '/data/ibague_veredas_poblacion.csv'
];
const out = document.getElementById('result');

async function check(path){
  const row = document.createElement('div');
  row.className = 'flex items-center gap-3 p-3 rounded-xl bg-white border';
  const name = document.createElement('div'); name.className='font-mono text-sm'; name.textContent = path;
  const status = document.createElement('span'); status.className='ml-auto text-xs'; status.textContent = '⌛ probando…';
  row.appendChild(name); row.appendChild(status); out.appendChild(row);
  try{
    const url = path;
    const r = await fetch(url, { cache:'no-store' });
    if(!r.ok) throw new Error(r.status+' '+r.statusText);
    // contenido rápido
    const text = await r.text();
    status.textContent = '✅ OK ('+text.length+' bytes)';
    status.className='ml-auto text-xs text-emerald-700';
  }catch(e){
    status.textContent = '❌ '+(e.message||'Error');
    status.className='ml-auto text-xs text-rose-700';
  }
}

FILES.forEach(check);
</script>
</body>
</html>
