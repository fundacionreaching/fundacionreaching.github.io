<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visor – Ibagué Corregimientos (GeoJSON)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style> html,body{height:100%;} #map{height:calc(100vh - 64px);} </style>
</head>
<body class="bg-slate-50 text-slate-900">
<header class="h-16 flex items-center justify-between px-4 border-b bg-white">
<h1 class="font-black">Ibagué — Corregimientos</h1>
<a class="text-indigo-600" href="/">Inicio</a>
</header>
<main id="map"></main>
<script>
(async function(){
const map = L.map('map').setView([4.4389,-75.2322], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
const col = v => v>8000?'#047857': v>4000?'#10b981': v>2000?'#34d399':'#6ee7b7';
const capa = L.geoJSON(null, { onEachFeature:(f,l)=>{
const nom = (f.properties.NOMBRE||f.properties.CORREGIM||f.properties.name||'Corregimiento').toUpperCase();
const pob = f.properties.poblacion || '';
l.bindPopup(`<strong>${nom}</strong>${pob? `<br>Población: ${pob.toLocaleString('es-CO')}`:''}`);
}, style:(f)=>({color:'#064e3b',weight:1,fillColor: col(f.properties.poblacion||0), fillOpacity:.6}) }).addTo(map);
try{
const gj = await fetch('/data/ibague_corregimientos.geojson',{cache:'no-store'}).then(r=>r.json());
capa.addData(gj); map.fitBounds(capa.getBounds());
}catch(e){ alert('No se pudo cargar /data/ibague_corregimientos.geojson'); }
})();
</script>
</body>
</html>
