<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reaching – Mapas Ibagué v2</title>
  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- PapaParse (CSV) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root{
      --bg:#0b1220;--card:#121a2a;--ink:#eaf0ff;--muted:#96a0b8;--accent:#2dd4bf;--accent2:#60a5fa;
    }
    html,body,#map{height:100%;margin:0}
    body{background:var(--bg);color:var(--ink);font:14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial}
    #map{isolation:isolate}
    .leaflet-container{background:#0b1220}
    .panel{
      position:absolute;inset:auto 12px 12px auto;z-index:1000;display:flex;flex-direction:column;gap:.5rem;
      background:rgba(18,26,42,.9);border:1px solid rgba(255,255,255,.08);padding:.75rem 1rem;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    .panel h2{margin:.1rem 0 .25rem;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em}
    .panel label{font-size:12px;color:var(--muted)}
    .panel select,.panel input[type="text"]{
      appearance:none;background:#0f1626;color:var(--ink);border:1px solid rgba(255,255,255,.12);padding:.5rem .75rem;border-radius:10px;width:220px
    }
    .legend{background:rgba(18,26,42,.9);padding:.5rem .75rem;border-radius:12px;border:1px solid rgba(255,255,255,.08);color:var(--ink)}
    .legend .scale{display:flex;gap:6px;margin-top:6px}
    .legend .box{width:20px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.2)}
    .info{padding:.35rem .6rem;background:rgba(18,26,42,.9);border:1px solid rgba(255,255,255,.08);border-radius:10px}
    .attribution{position:absolute;right:12px;bottom:12px;color:var(--muted);font-size:11px;z-index:900}
    .badge{display:inline-block;padding:.15rem .45rem;border:1px solid rgba(255,255,255,.16);border-radius:999px;font-size:11px;color:var(--muted)}
    .tooltip-table{border-collapse:collapse}
    .tooltip-table td{padding:2px 6px;border-bottom:1px dashed rgba(255,255,255,.08)}
    .tooltip-table td:first-child{color:var(--muted)}
    .credit{position:absolute;left:12px;top:12px;z-index:1000;background:rgba(18,26,42,.9);padding:.4rem .6rem;border-radius:12px;border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="credit">Reaching · Ibagué v2</div>
  <div id="panel" class="panel" role="region" aria-label="Controles del mapa">
    <div>
      <h2>Capa activa</h2>
      <select id="layerSelect" title="Selecciona capa">
        <option value="comunas">Comunas</option>
        <option value="corregimientos">Corregimientos</option>
        <option value="municipios">Municipios</option>
      </select>
    </div>
    <div>
      <h2>Métrica del censo</h2>
      <select id="metricSelect" title="Selecciona métrica"></select>
    </div>
    <div>
      <label class="badge" id="countLabel">—</label>
    </div>
  </div>
  <div class="attribution">Base: © OpenStreetMap · Estilo: © CARTO</div>

<script>
// =====================
// CONFIGURACIÓN RÁPIDA
// =====================
const CONFIG = {
  dataDir: '/data', // Cambia si usas otra carpeta
  files: {
    comunas: 'comunas.geojson',
    corregimientos: 'corregimientos.geojson',
    municipios: 'municipios.geojson',
    censo: 'censo.csv'
  },
  // Mapea los campos clave para hacer el join entre el GeoJSON y el CSV
  keys: {
    comunas: { geojson: 'codigo_comuna', csv: 'codigo' },
    corregimientos: { geojson: 'codigo_corregimiento', csv: 'codigo' },
    municipios: { geojson: 'codigo_municipio', csv: 'codigo' }
  },
  // Nombre por defecto de la métrica (debe existir en el CSV y ser numérica)
  defaultMetric: 'poblacion_total',
  // Campos candidatos para mostrar el nombre en popups (se usan por orden)
  nameFields: ['nombre', 'NOMBRE', 'name', 'nom_comuna', 'nom_corr', 'nom_mpio']
};

// Paleta de colores (de claro a intenso)
const PALETTE = ['#e6f5ff','#b3e1ff','#7cc4fa','#3fa1f4','#1f78ff','#0b4dd9'];

const state = {
  map: null,
  base: {},
  layers: {},            // { comunas: L.GeoJSON, ... }
  rawGeo: {},            // GeoJSON crudo
  censoIndex: {},        // { colName: Map(value => row) }
  numericColumns: [],
  currentLayer: 'comunas',
  currentMetric: CONFIG.defaultMetric,
  breaks: []
};

init();

async function init(){
  // 1) Mapa
  state.map = L.map('map', { zoomControl: true }).setView([4.4389, -75.2322], 11);
  const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '',
    maxZoom: 19
  }).addTo(state.map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution: '',
    opacity: .15
  }).addTo(state.map);

  // 2) Censo CSV → índices por cada columna clave que vayamos a usar
  const csvText = await fetch(`${CONFIG.dataDir}/${CONFIG.files.censo}`).then(r=>{
    if(!r.ok) throw new Error('No se pudo cargar el CSV de censo');
    return r.text();
  });
  const parsed = Papa.parse(csvText, { header:true, dynamicTyping:true });
  const rows = parsed.data.filter(r=>Object.keys(r).length>0);

  // Detecta columnas numéricas (para poblar el selector de métrica)
  state.numericColumns = detectNumericColumns(rows);
  if(!state.numericColumns.includes(CONFIG.defaultMetric)){
    state.currentMetric = state.numericColumns[0] || null;
  }

  // Construye índices por cada columna csv usada en CONFIG.keys
  const csvKeyCols = new Set(Object.values(CONFIG.keys).map(k=>k.csv));
  for(const col of csvKeyCols){
    const m = new Map();
    for(const row of rows){
      const key = row[col];
      if(key !== undefined && key !== null && key !== '') m.set(String(key), row);
    }
    state.censoIndex[col] = m;
  }

  buildMetricSelect();

  // 3) Cargar las 3 capas GeoJSON
  await Promise.all(['comunas','corregimientos','municipios'].map(async name => {
    const url = `${CONFIG.dataDir}/${CONFIG.files[name]}`;
    const gj = await fetch(url).then(r=>{ if(!r.ok) throw new Error('No se pudo cargar '+url); return r.json(); });
    state.rawGeo[name] = gj;
    state.layers[name] = L.geoJSON(gj, {
      style: feat => featureStyle(feat, name),
      onEachFeature: (feat, layer) => attachFeatureUI(feat, layer, name)
    });
  }));

  // 4) Vista inicial
  setActiveLayer(state.currentLayer);

  // 5) Controles UI
  document.getElementById('layerSelect').addEventListener('change', (e)=>{
    setActiveLayer(e.target.value);
  });
  document.getElementById('metricSelect').addEventListener('change', (e)=>{
    state.currentMetric = e.target.value;
    restyleActiveLayer();
  });
}

function detectNumericColumns(rows){
  if(rows.length === 0) return [];
  const cols = Object.keys(rows[0]);
  const numeric = [];
  for(const c of cols){
    let ok=0, seen=0;
    for(const r of rows){
      const v = r[c];
      if(v === null || v === '' || v === undefined) continue;
      seen++;
      if(typeof v === 'number' && Number.isFinite(v)) ok++;
      else if(!isNaN(parseFloat(v))) ok++;
    }
    if(seen>0 && ok/seen > 0.9) numeric.push(c);
  }
  // Coloca default primero si existe
  numeric.sort((a,b)=> (a===CONFIG.defaultMetric?-1:0) - (b===CONFIG.defaultMetric?-1:0));
  return numeric;
}

function buildMetricSelect(){
  const sel = document.getElementById('metricSelect');
  sel.innerHTML = '';
  for(const col of state.numericColumns){
    const opt = document.createElement('option');
    opt.value = col; opt.textContent = col.replace(/_/g,' ');
    sel.appendChild(opt);
  }
  if(state.currentMetric) sel.value = state.currentMetric;
}

function setActiveLayer(name){
  // Quita capa previa
  for(const key of Object.keys(state.layers)){
    if(state.map.hasLayer(state.layers[key])) state.map.removeLayer(state.layers[key]);
  }
  state.currentLayer = name;
  const layer = state.layers[name];
  layer.addTo(state.map);
  try{ state.map.fitBounds(layer.getBounds(), { padding:[20,20] }); }catch{ /* sin geometría */ }
  restyleActiveLayer();
}

function restyleActiveLayer(){
  const layer = state.layers[state.currentLayer];
  // Recalcular cortes solo con features visibles y con valor válido
  const values = [];
  layer.eachLayer(l=>{
    const f = l.feature;
    const val = getMetricValue(f, state.currentLayer);
    if(val !== null && isFinite(val)) values.push(Number(val));
  });
  state.breaks = computeQuantileBreaks(values, PALETTE.length);

  layer.setStyle(feat => featureStyle(feat, state.currentLayer));
  updateLegend();
  updateCountLabel();
}

function computeQuantileBreaks(values, classes=6){
  if(!values || values.length===0) return [];
  const arr = [...values].sort((a,b)=>a-b);
  const cuts = [];
  for(let i=1;i<classes;i++){
    const q = i/classes;
    const idx = Math.floor(q*(arr.length-1));
    cuts.push(arr[idx]);
  }
  return cuts; // length = classes-1
}

function getColor(v){
  if(v===null || !isFinite(v) || !state.breaks.length) return '#6b7280';
  let i=0;
  while(i<state.breaks.length && v>state.breaks[i]) i++;
  return PALETTE[i];
}

function featureStyle(feat, layerName){
  const v = getMetricValue(feat, layerName);
  return {
    color: '#111827',
    weight: 1,
    opacity: 0.8,
    fillColor: getColor(v),
    fillOpacity: 0.85
  };
}

function attachFeatureUI(feat, layer, layerName){
  layer.on({
    mouseover: (e)=>{
      const l=e.target; l.setStyle({ weight:2, color:'#0ea5e9' }); l.bringToFront();
    },
    mouseout: (e)=>{
      layer.setStyle(featureStyle(feat, layerName));
    },
    click: (e)=>{
      const props = feat.properties||{};
      const name = guessName(props);
      const join = getJoinRow(feat, layerName);
      const metricName = state.currentMetric?.replace(/_/g,' ');
      const metricVal = formatNum(getMetricValue(feat, layerName));

      let html = `<div><strong>${escapeHtml(name||'—')}</strong><br><span class="badge">${metricName||'métrica'}</span> <b>${metricVal}</b></div><hr style="border-color:rgba(255,255,255,.08)">`;
      html += '<table class="tooltip-table">';
      const show = [state.currentMetric, ...Object.keys((join||{})).slice(0,6)];
      const seen = new Set();
      for(const k of show){
        if(!k || seen.has(k)) continue; seen.add(k);
        const v = join? join[k] : null;
        if(v===undefined || v==='' || v===null) continue;
        html += `<tr><td>${escapeHtml(k)}</td><td><b>${escapeHtml(String(v))}</b></td></tr>`;
      }
      html += '</table>';
      layer.bindPopup(html, { className:'reaching-popup' }).openPopup();
    }
  });
}

function getJoinRow(feat, layerName){
  const keyFieldGeo = CONFIG.keys[layerName].geojson;
  const keyFieldCsv = CONFIG.keys[layerName].csv;
  const props = feat.properties||{};
  const key = props[keyFieldGeo];
  const m = state.censoIndex[keyFieldCsv];
  if(m && key!==undefined && key!==null) return m.get(String(key))||null;
  return null;
}

function getMetricValue(feat, layerName){
  const join = getJoinRow(feat, layerName);
  if(!join || !state.currentMetric) return null;
  const v = join[state.currentMetric];
  const n = (typeof v==='number'? v : parseFloat(v));
  return Number.isFinite(n)? n : null;
}

function guessName(props){
  for(const k of CONFIG.nameFields){ if(props && props[k]) return props[k]; }
  // fallback: primer string que parezca nombre
  if(props){
    for(const [k,v] of Object.entries(props)){
      if(/nom|name|desc|label/i.test(k) && typeof v==='string') return v;
    }
  }
  return null;
}

function updateCountLabel(){
  const layer = state.layers[state.currentLayer];
  let total=0, withVal=0;
  layer.eachLayer(l=>{ total++; const v=getMetricValue(l.feature,state.currentLayer); if(v!==null) withVal++; });
  document.getElementById('countLabel').textContent = `${withVal}/${total} con datos`;
}

function updateLegend(){
  // Quita leyenda previa si existe
  if(state.legendCtl){ state.map.removeControl(state.legendCtl); }
  const palette = PALETTE;
  const breaks = state.breaks;
  state.legendCtl = L.control({position:'bottomleft'});
  state.legendCtl.onAdd = function(){
    const div = L.DomUtil.create('div','legend');
    const title = state.currentMetric ? state.currentMetric.replace(/_/g,' ') : 'métrica';
    let html = `<div style="font-weight:600;font-size:12px;margin-bottom:4px">${escapeHtml(title)}</div>`;
    html += '<div class="scale">';
    for(let i=0;i<palette.length;i++){
      html += `<div class="box" style="background:${palette[i]}"></div>`;
    }
    html += '</div>';
    if(breaks.length){
      const labels = ['mín'];
      for(const b of breaks){ labels.push(formatNum(b)); }
      labels.push('máx');
      html += `<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:#9aa5bd"><span>${labels[0]}</span><span>${labels[Math.floor(labels.length/2)]}</span><span>${labels.at(-1)}</span></div>`;
    }
    div.innerHTML = html; return div;
  };
  state.legendCtl.addTo(state.map);
}

function formatNum(n){
  if(n===null||n===undefined||!isFinite(n)) return '—';
  return new Intl.NumberFormat('es-CO').format(+n);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[s]));
}
</script>
</body>
</html>
