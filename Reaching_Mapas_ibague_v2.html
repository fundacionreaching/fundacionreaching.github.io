<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fundación Reaching — Mapas Ibagué & Tolima (v2 • dos columnas)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--bg:#0b1020;--fg:#eef3ff;--mut:#9aa3b2;--ok:#43d17a;--warn:#ffe08a;--info:#6bd1ff;--vio:#b78cff}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Inter,Arial,sans-serif}
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{position:sticky;top:0;z-index:20;background:#0d1430cc;backdrop-filter:blur(6px);
    border-bottom:1px solid #ffffff14;padding:.6rem .8rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
  h1{font-size:1.06rem;margin:0} .sub{color:var(--mut);font-size:.86rem}
  .layout{display:grid;grid-template-columns:320px 1fr;gap:.8rem;height:calc(100vh - 64px);padding:.8rem}
  .layout.collapsed{grid-template-columns:0 1fr}
  .panel{border:1px solid #ffffff16;border-radius:12px;padding:.8rem;background:#0e1537;overflow:auto}
  .panel h3{margin:.1rem 0 .5rem}
  .btn{border:1px solid #ffffff26;background:#141d4a;color:var(--fg);padding:.45rem .7rem;border-radius:999px;cursor:pointer;font-weight:600}
  .chip{border:1px solid #ffffff26;background:#121a45;color:var(--fg);padding:.45rem .7rem;border-radius:999px;cursor:pointer;font-weight:600}
  .btn-row{display:flex;flex-wrap:wrap;gap:.4rem}
  #mapWrap{position:relative} #map{height:100%;min-height:520px;border:1px solid #ffffff16;border-radius:12px;overflow:hidden}
  input[type="search"}{width:100%;border:1px solid #ffffff26;background:#0e1433;color:#fff;border-radius:10px;padding:.55rem .7rem}
  input[type="search"]{width:100%;border:1px solid #ffffff26;background:#0e1433;color:#fff;border-radius:10px;padding:.55rem .7rem}
  small{color:var(--mut)}
  .legend{position:absolute;bottom:12px;left:12px;background:#121a45cc;border:1px solid #ffffff26;border-radius:10px;padding:.5rem .6rem;font-size:.85rem}
  .sw{display:inline-block;width:14px;height:10px;margin-right:6px;border:1px solid #ffffff26;border-radius:3px}
  footer{color:var(--mut);text-align:center;padding:.6rem .8rem}
  .ghost{background:transparent;border:1px solid #ffffff26}
  .group{margin-bottom:.75rem}
  .error{margin-top:.4rem;color:#ffb3b3;font-size:.9rem}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Fundación Reaching — Mapas Ibagué & Tolima</h1>
      <div class="sub">Comunas, Corregimientos, Veredas y Municipios. Censo (CNPV 2018).</div>
    </div>
    <div class="btn-row">
      <button id="btnCollapse" class="btn ghost">☰ Ocultar/mostrar menú</button>
      <button id="btnReset" class="btn ghost">⟳ Restablecer vista</button>
    </div>
  </header>

  <main id="layout" class="layout">
    <!-- Menú izquierdo -->
    <aside class="panel">
      <div class="group">
        <h3>Estilo</h3>
        <div class="btn-row">
          <button class="btn" data-style="detallada">Detallada</button>
          <button class="btn" data-style="densidad">Auto-densidad</button>
          <button class="btn" data-style="poblacion">Población</button>
        </div>
        <small>“Población” colorea <b>Municipios</b> si detecta censo.</small>
      </div>

      <div class="group">
        <h3>Capas</h3>
        <div class="btn-row">
          <button class="chip" id="toggleComunas">Comunas</button>
          <button class="chip" id="toggleCorreg">Corregimientos</button>
          <button class="chip" id="toggleVeredas">Veredas</button>
          <button class="chip" id="toggleMpios">Municipios</button>
        </div>
      </div>

      <div class="group">
        <h3>Búsqueda</h3>
        <input id="q" type="search" placeholder="Escribe parte del nombre y Enter"/>
        <small>Comuna / Corregimiento / Vereda / Municipio.</small>
      </div>

      <div class="group">
        <h3>Diagnóstico</h3>
        <div id="diag" style="font-size:.92rem;line-height:1.25;color:#dbe5ff"></div>
        <div id="jsErr" class="error"></div>
      </div>
    </aside>

    <!-- Mapa derecho -->
    <section id="mapWrap">
      <div id="map"></div>
      <div id="legend" class="legend" style="display:none"></div>
    </section>
  </main>

  <footer>Base OSM/Carto/Esri | DANE CNPV 2018 | v2 dos columnas</footer>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Script único (incluye verificación “JS listo ✔”) -->
<script>
/* ===== Captura errores y OK de JS ===== */
const Diag = { el:null,
  log(msg, ok=true){ const d=document.createElement("div"); d.textContent=(ok?"✅ ":"❌ ")+msg; this.el&&this.el.appendChild(d); }
};
window.addEventListener("DOMContentLoaded", ()=>{
  Diag.el=document.getElementById("diag");
  Diag.log("JS listo ✔");
});
window.onerror = function(msg, src, line, col){
  const el=document.getElementById('jsErr');
  el.textContent = "⚠️ Error de script: "+msg+" ("+src+":"+line+":"+col+")";
};

/* ===== CONFIG ===== */
const CONFIG = {
  boundsTolima: [[3.2,-75.7],[5.7,-74.6]],
  data: {
    comunas: ["./ibague_urbano.geojson","./data/ibague_urbano.geojson"],
    correg:  ["./ibague_corregimientos.geojson","./data/ibague_corregimientos.geojson"],
    veredas: ["./ibague_veredas.geojson","./data/ibague_veredas.geojson"],
    mpios:   ["./tolima_municipios.geojson","./data/tolima_municipios.geojson"]
  },
  census: ["./municipios_censo.json","./tolima_censo.json","./data/municipios_censo.json","./data/tolima_censo.json"],
  nameKeys: ["NOMBRE","NOM_MPIO","NOMBRE_MPIO","MPIO_CNMBR","COMUNA","NOM_COMUNA","CORREGIMIENTO","NOM_CORR","VEREDA","NOM_VEREDA","nombre"],
  codeKeys: ["MPIO_CCDGO","COD_DANE","cod_dane","MPIO","CODIGO","codigo","DANE","mpio_cod","codmpio"],
  popKeys : ["POB_TOTAL","poblacion","POBLACION","TOTAL","POB_2018","POB","total"]
};

/* ===== Util ===== */
function toast(msg, ms=2400){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;right:12px;bottom:12px;background:#16204a;color:#fff;border:1px solid #ffffff33;border-radius:12px;padding:.55rem .75rem;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.35)";
  document.body.appendChild(t); setTimeout(()=>t.remove(),ms);
}
function guessKey(obj, arr){
  for(const k of arr) if(obj && Object.hasOwn(obj,k)) return k;
  for(const k in obj) if(arr.some(a=>k.toLowerCase().includes(a.toLowerCase()))) return k;
  return null;
}
function getName(p){ const k=guessKey(p,CONFIG.nameKeys)||Object.keys(p||{})[0]; return p&&p[k]?String(p[k]):"Sin nombre"; }
function getCode(p){ const k=guessKey(p,CONFIG.codeKeys); return k&&p[k]!=null?String(p[k]).padStart(5,"0"):null; }

/* ===== Mapa ===== */
const map=L.map("map",{preferCanvas:true});
const baseOSM=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:"© OSM"});
const baseCarto=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',{maxZoom:20,attribution:"© CartoDB"});
const baseSat=L.tileLayer('https://{s}.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{subdomains:['server','services'],maxZoom:19,attribution:"© Esri"});
baseOSM.addTo(map); map.fitBounds(CONFIG.boundsTolima);
L.control.layers({"OSM":baseOSM,"OSM Claro":baseCarto,"Satélite":baseSat},{}).addTo(map);

const layers={comunas:null,correg:null,veredas:null,mpios:null};
const cache={census:null,popKey:null,codeKey:null};

/* ===== Estilos & leyenda ===== */
function baseStyle(c){return{color:c||'#69d1ff',weight:1,fillOpacity:.15}}
function hoverStyle(){return{weight:3,fillOpacity:.3}}
function attachInteractive(group,label){
  if(!group) return;
  group.eachLayer(l=>{
    l.bindTooltip(`${label}: <b>${getName(l.feature.properties||{})}</b>`);
    l.on("mouseover",()=>l.setStyle(hoverStyle()));
    l.on("mouseout",()=>l.setStyle(baseStyle()));
  });
}
function ramp(){return ['#e6f3ff','#bcdfff','#86c6ff','#4aa6ff','#1e82e6','#0a63c7']}
function breaksFrom(vals,n=6){
  const v=vals.filter(Number.isFinite).sort((a,b)=>a-b); if(!v.length) return [];
  const br=[v[0]]; for(let i=1;i<n;i++) br.push(v[Math.floor(i*(v.length-1)/n)]); br.push(v[v.length-1]); return br;
}
function legend(title, br){
  const Lg=document.getElementById("legend"); if(!br||br.length<2){Lg.style.display="none";return}
  const R=ramp(); let html=`<div style="font-weight:700;margin-bottom:.2rem">${title}</div>`;
  for(let i=0;i<br.length-1;i++){
    html+=`<div><span class="sw" style="background:${R[Math.min(i,R.length-1)]}"></span>${Math.round(br[i]).toLocaleString('es-CO')}–${Math.round(br[i+1]).toLocaleString('es-CO')}</div>`;
  }
  Lg.innerHTML=html; Lg.style.display="block";
}
function styleBy(mapVals){
  const vals=[...mapVals.values()].filter(Number.isFinite);
  const br=breaksFrom(vals,6), R=ramp();
  return feat=>{
    const code=getCode(feat.properties||{}); const v=code?mapVals.get(code):null;
    if(!Number.isFinite(v)) return baseStyle('#43d17a');
    let idx=br.findIndex(b=>v<=b)-1; if(idx<0) idx=br.length-2; idx=Math.max(0,Math.min(idx,R.length-1));
    return {color:'#0a63c7',weight:1,fillOpacity:.7,fillColor:R[idx]};
  };
}
/* Auto-densidad aproximada por área (bbox) */
function styleByArea(){
  return (feat)=>{
    try{
      const gj=L.geoJSON(feat); const b=gj.getBounds();
      const area=Math.abs((b.getEast()-b.getWest())*(b.getNorth()-b.getSouth()));
      const score=Math.min(1,Math.max(0, area/4));
      const R=ramp(); const i=Math.min(R.length-1, Math.floor(score*(R.length-1)));
      return {color:'#2a93ff',weight:1,fillOpacity:.65,fillColor:R[i]};
    }catch(_){ return baseStyle(); }
  };
}

/* ===== Fetch helpers ===== */
async function fetchJson(u){
  const r=await fetch(u,{cache:"no-store"}); if(!r.ok) throw new Error(r.status+" "+r.statusText);
  const txt=await r.text(); return JSON.parse(txt);
}
async function trySources(urls,label){
  for(const u of urls){
    try{ const data=await fetchJson(u); Diag.log(`${label}: ${u} ✔ OK`); return data; }
    catch(e){ Diag.log(`${label}: ${u} — ${e.message}`, false); }
  }
  return null;
}

/* ===== Carga ===== */
async function loadAll(){
  try{
    const comunas=await trySources(CONFIG.data.comunas,"Comunas (GeoJSON)");
    if(comunas){ layers.comunas=L.geoJSON(comunas,{style:baseStyle('#6bd1ff')}).addTo(map); attachInteractive(layers.comunas,"Comuna"); }
    const correg =await trySources(CONFIG.data.correg,"Corregimientos (GeoJSON)");
    if(correg){ layers.correg=L.geoJSON(correg,{style:baseStyle('#ffe08a')}).addTo(map); attachInteractive(layers.correg,"Correg."); }
    const veredas=await trySources(CONFIG.data.veredas,"Veredas (GeoJSON)");
    if(veredas){ layers.veredas=L.geoJSON(veredas,{style:baseStyle('#b78cff')}).addTo(map); attachInteractive(layers.veredas,"Vereda"); }
    const mpios  =await trySources(CONFIG.data.mpios,"Municipios (GeoJSON)");
    if(mpios){ layers.mpios=L.geoJSON(mpios,{style:baseStyle('#43d17a')}).addTo(map); attachInteractive(layers.mpios,"Municipio"); }

    // Índice búsqueda
    window._idx=[];
    [layers.comunas,layers.correg,layers.veredas,layers.mpios].forEach(g=>g&&g.eachLayer(l=>{ window._idx.push({name:getName(l.feature.properties||{}), bounds:l.getBounds()}); }));
    Diag.log(`Índice de búsqueda: ${_idx.length} elementos ✔`);

    // Censo opcional (municipios)
    for(const u of CONFIG.census){
      try{
        const data=await fetchJson(u);
        const sample=Array.isArray(data)?data[0]:Object.values(data)[0];
        cache.codeKey=guessKey(sample||data,CONFIG.codeKeys); cache.popKey=guessKey(sample||data,CONFIG.popKeys);
        if(!cache.codeKey||!cache.popKey) throw new Error("no llaves (código/población)");
        const M=new Map(); const push=row=>{
          const code=String(row[cache.codeKey]).padStart(5,"0");
          const val=Number(String(row[cache.popKey]).replace(/[^\d.]/g,''));
          if(code && Number.isFinite(val)) M.set(code,val);
        };
        if(Array.isArray(data)) data.forEach(push); else Object.values(data).forEach(push);
        cache.census=M; Diag.log(`Censo: ${u} ✔ (${M.size} municipios)`);
        break;
      }catch(e){ Diag.log(`Censo: ${u} — ${e.message}`, false); }
    }
  }catch(e){ Diag.log("Fallo general de carga: "+e.message, false); }
}
loadAll();

/* ===== UI ===== */
function safeToggle(layer,nombre){
  if(!layer){ toast(`La capa “${nombre}” aún no está cargada`); return; }
  if(map.hasLayer(layer)){ map.removeLayer(layer); toast(`Ocultando ${nombre}`); }
  else { layer.addTo(map); toast(`Mostrando ${nombre}`); }
  setTimeout(()=>map.invalidateSize(),60);
}
function applyStyle(mode){
  if(mode==="poblacion"){
    if(cache.census && layers.mpios){
      layers.mpios.setStyle(styleBy(cache.census));
      legend("Población (CNPV 2018)", breaksFrom([...cache.census.values()],6));
      toast("Estilo: Población");
    }else{
      toast("No hay censo detectado. Manteniendo estilo detallado.");
    }
  }else if(mode==="densidad"){
    if(layers.mpios){ layers.mpios.setStyle(styleByArea()); document.getElementById("legend").style.display="none"; toast("Estilo: Auto-densidad"); }
  }else{
    if(layers.mpios) layers.mpios.setStyle(baseStyle('#43d17a'));
    if(layers.comunas) layers.comunas.setStyle(baseStyle('#6bd1ff'));
    if(layers.correg) layers.correg.setStyle(baseStyle('#ffe08a'));
    if(layers.veredas) layers.veredas.setStyle(baseStyle('#b78cff'));
    document.getElementById("legend").style.display="none";
    toast("Estilo: Detallada");
  }
}
document.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>applyStyle(b.dataset.style)));
document.getElementById("toggleComunas").onclick=()=>safeToggle(layers.comunas,"Comunas");
document.getElementById("toggleCorreg").onclick =()=>safeToggle(layers.correg,"Corregimientos");
document.getElementById("toggleVeredas").onclick=()=>safeToggle(layers.veredas,"Veredas");
document.getElementById("toggleMpios").onclick  =()=>safeToggle(layers.mpios,"Municipios");
document.getElementById("q").addEventListener("keydown",(e)=>{
  if(e.key!=="Enter") return; const t=e.target.value.trim().toLowerCase(); if(!t) return;
  const hit=(window._idx||[]).find(x=>x.name.toLowerCase().includes(t));
  if(hit&&hit.bounds) map.fitBounds(hit.bounds.pad(0.4)); else toast("Sin resultados");
});
document.getElementById("btnReset").onclick=()=>{ map.fitBounds(CONFIG.boundsTolima); setTimeout(()=>map.invalidateSize(),60); };
document.getElementById("btnCollapse").onclick=()=>{ const lay=document.getElementById("layout"); lay.classList.toggle("collapsed"); setTimeout(()=>map.invalidateSize(),120); };
</script>
</body>
</html>
