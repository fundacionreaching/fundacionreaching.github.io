<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fundación Reaching — Mapas Ibagué & Tolima (v3 compat)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--bg:#0b1020;--fg:#eef3ff;--mut:#9aa3b2;--ok:#43d17a;--warn:#ffe08a;--info:#6bd1ff}
  *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0b1020;color:var(--fg);font-family:system-ui,Inter,Arial,sans-serif}
  header{position:sticky;top:0;background:#0d1430cc;backdrop-filter:blur(6px);padding:.6rem .8rem;border-bottom:1px solid #ffffff14}
  h1{font-size:1.05rem;margin:.1rem 0}.sub{color:var(--mut);font-size:.86rem}
  .wrap{display:grid;gap:.7rem;padding:.8rem}.grid{display:grid;grid-template-columns:1fr;gap:.7rem}
  @media(min-width:960px){.grid{grid-template-columns:320px 1fr}}
  .panel{border:1px solid #ffffff16;border-radius:12px;padding:.8rem;background:#0e1537}
  .btn{border:1px solid #ffffff26;background:#141d4a;color:var(--fg);padding:.45rem .7rem;border-radius:999px;cursor:pointer;font-weight:600}
  .btn-row{display:flex;flex-wrap:wrap;gap:.4rem}
  #map{height:68dvh;min-height:480px;border:1px solid #ffffff16;border-radius:12px;overflow:hidden}
  input[type="search"]{width:100%;border:1px solid #ffffff26;background:#0e1433;color:#fff;border-radius:10px;padding:.55rem .7rem}
  small{color:var(--mut)}
  .legend{position:absolute;bottom:12px;left:12px;background:#121a45cc;border:1px solid #ffffff26;border-radius:10px;padding:.5rem .6rem;font-size:.85rem}
  .sw{display:inline-block;width:14px;height:10px;margin-right:6px;border:1px solid #ffffff26;border-radius:3px}
  footer{color:var(--mut);text-align:center;padding:.8rem}
</style>
</head>
<body>
<header>
  <h1>Fundación Reaching — Mapas Ibagué & Tolima (v2 compat)</h1>
  <div class="sub">Comunas, Corregimientos y Municipios (CNPV 2018). Diagnóstico en vivo.</div>
</header>

<main class="wrap">
  <div class="grid">
    <aside class="panel">
      <div style="font-weight:700;margin-bottom:.4rem">Controles</div>
      <div class="btn-row" style="margin-bottom:.5rem">
        <button class="btn" data-style="detallada">Detallada</button>
        <button class="btn" data-style="poblacion">Población</button>
      </div>
      <div style="font-weight:700;margin:.4rem 0 .2rem">Capas</div>
      <div class="btn-row" style="margin-bottom:.6rem">
        <button class="btn" id="toggleComunas">Comunas</button>
        <button class="btn" id="toggleCorreg">Corregimientos</button>
        <button class="btn" id="toggleMpios">Municipios</button>
      </div>
      <div style="font-weight:700;margin:.4rem 0 .2rem">Búsqueda</div>
      <input id="q" type="search" placeholder="Escribe parte del nombre y Enter"/>
      <small>Busca una comuna/corregimiento/municipio por nombre.</small>
      <div style="font-weight:700;margin:.7rem 0 .2rem">Diagnóstico</div>
      <div id="diag" style="font-size:.92rem;line-height:1.25;color:#dbe5ff"></div>
    </aside>

    <section style="position:relative">
      <div id="map"></div>
      <div id="legend" class="legend" style="display:none"></div>
    </section>
  </div>
</main>

<footer>Base OSM/Esri | DANE CNPV 2018 | v2 compat</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===== CONFIG (v2 compat) ===== */
const CONFIG = {
  boundsTolima: [[3.2,-75.7],[5.7,-74.6]],
  data: {
    comunas: ["./ibague_urbano.geojson","./data/ibague_urbano.geojson"],
    correg:  ["./ibague_corregimientos.geojson","./data/ibague_corregimientos.geojson"],
    mpios:   ["./tolima_municipios.geojson","./data/tolima_municipios.geojson"]
  },
  census: ["./municipios_censo.json","./tolima_censo.json","./data/municipios_censo.json","./data/tolima_censo.json"],
  nameKeys: ["NOMBRE","NOM_MPIO","NOMBRE_MPIO","MPIO_CNMBR","COMUNA","NOM_COMUNA","CORREGIMIENTO","NOM_CORR","nombre"],
  codeKeys: ["MPIO_CCDGO","COD_DANE","cod_dane","MPIO","CODIGO","codigo","DANE","mpio_cod","codmpio"],
  popKeys : ["POB_TOTAL","poblacion","POBLACION","TOTAL","POB_2018","POB","total"]
};

/* ===== util ===== */
const Diag = { el: document.getElementById("diag"),
  log(msg, ok=true){ const d=document.createElement("div"); d.textContent=(ok?"✅ ":"❌ ")+msg; this.el.appendChild(d); }
};
function guessKey(obj, arr){
  for(const k of arr) if(obj && Object.hasOwn(obj,k)) return k;
  for(const k in obj) if(arr.some(a=>k.toLowerCase().includes(a.toLowerCase()))) return k;
  return null;
}
function getName(p){ const k=guessKey(p,CONFIG.nameKeys)||Object.keys(p)[0]; return p&&p[k]?String(p[k]):"Sin nombre"; }
function getCode(p){ const k=guessKey(p,CONFIG.codeKeys); return k&&p[k]!=null?String(p[k]).padStart(5,"0"):null; }
async function fetchFirstOk(urls, label){
  for(const u of urls){
    try{
      const r = await fetch(u,{cache:"no-store"});
      if(!r.ok) throw new Error(r.status+" "+r.statusText);
      const txt = await r.text(); const data = JSON.parse(txt);
      Diag.log(`${label}: ${u} ✔ OK`); return data;
    }catch(e){ Diag.log(`${label}: ${u} — ${e.message}`, false); }
  } throw new Error(`No se pudo cargar ${label}`);
}

/* ===== mapa base ===== */
const map = L.map("map",{preferCanvas:true});
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:"© OSM"});
const sat = L.tileLayer('https://{s}.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{subdomains:['server','services'],maxZoom:19,attribution:"© Esri"});
osm.addTo(map); map.fitBounds(CONFIG.boundsTolima); L.control.layers({"OSM":osm,"Satélite":sat},{}).addTo(map);

const layers = {comunas:null,correg:null,mpios:null};
const cache = {census:null,popKey:null,codeKey:null};
function baseStyle(c){return{color:c||'#69d1ff',weight:1,fillOpacity:.15}}
function hoverStyle(){return{weight:3,fillOpacity:.3}}
function attachInteractive(group,label){
  if(!group) return;
  group.eachLayer(l=>{
    l.bindTooltip(`${label}: <b>${getName(l.feature.properties||{})}</b>`);
    l.on("mouseover",()=>l.setStyle(hoverStyle()));
    l.on("mouseout",()=>l.setStyle(baseStyle()));
  });
}

/* ===== leyenda / escalas ===== */
function ramp(){return ['#e6f3ff','#bcdfff','#86c6ff','#4aa6ff','#1e82e6','#0a63c7']}
function breaksFrom(vals,n=6){
  const v=vals.filter(Number.isFinite).sort((a,b)=>a-b); if(!v.length) return [];
  const br=[v[0]]; for(let i=1;i<n;i++) br.push(v[Math.floor(i*(v.length-1)/n)]); br.push(v[v.length-1]); return br;
}
function legend(title, br){
  const Lg=document.getElementById("legend"); if(!br||br.length<2){Lg.style.display="none";return}
  const R=ramp(); let html=`<div style="font-weight:700;margin-bottom:.2rem">${title}</div>`;
  for(let i=0;i<br.length-1;i++){ html+=`<div><span class="sw" style="background:${R[Math.min(i,R.length-1)]}"></span>${Math.round(br[i]).toLocaleString('es-CO')}–${Math.round(br[i+1]).toLocaleString('es-CO')}</div>`}
  Lg.innerHTML=html; Lg.style.display="block";
}

/* ===== estilo por población ===== */
function styleBy(mapVals){
  const vals=[...mapVals.values()].filter(Number.isFinite);
  const br=breaksFrom(vals,6), R=ramp();
  return feat=>{
    const code=getCode(feat.properties||{}); const v=code?mapVals.get(code):null;
    if(!Number.isFinite(v)) return baseStyle('#43d17a');
    let idx=br.findIndex(b=>v<=b)-1; if(idx<0) idx=br.length-2; idx=Math.max(0,Math.min(idx,R.length-1));
    return {color:'#0a63c7',weight:1,fillOpacity:.7,fillColor:R[idx]};
  };
}

/* ===== carga ===== */
async function loadAll(){
  try{
    const [c1,c2,c3] = await Promise.all([
      fetchFirstOk(CONFIG.data.comunas,"Comunas (GeoJSON)"),
      fetchFirstOk(CONFIG.data.correg,"Corregimientos (GeoJSON)"),
      fetchFirstOk(CONFIG.data.mpios,"Municipios (GeoJSON)")
    ]);
    layers.comunas=L.geoJSON(c1,{style:baseStyle('#6bd1ff')}).addTo(map);
    layers.correg =L.geoJSON(c2,{style:baseStyle('#ffe08a')}).addTo(map);
    layers.mpios  =L.geoJSON(c3,{style:baseStyle('#43d17a')}).addTo(map);
    [ ["Comuna",layers.comunas],["Correg.",layers.correg],["Municipio",layers.mpios] ].forEach(([lbl,g])=>attachInteractive(g,lbl));

    // índice de búsqueda
    window._idx=[]; [layers.comunas,layers.correg,layers.mpios].forEach(g=>g&&g.eachLayer(l=>{
      window._idx.push({name:getName(l.feature.properties||{}), bounds:l.getBounds()});
    }));
    Diag.log(`Índice de búsqueda: ${_idx.length} elementos ✔`);

    // censo opcional
    for(const u of CONFIG.census){
      try{
        const r=await fetch(u,{cache:"no-store"}); if(!r.ok) throw new Error(r.status);
        const data=await r.json(); const sample=Array.isArray(data)?data[0]:Object.values(data)[0];
        cache.codeKey=guessKey(sample||data,CONFIG.codeKeys); cache.popKey=guessKey(sample||data,CONFIG.popKeys);
        if(!cache.codeKey||!cache.popKey) throw new Error("no llaves (código/población)");
        const M=new Map(); const push=row=>{
          const code=String(row[cache.codeKey]).padStart(5,"0");
          const val=Number(String(row[cache.popKey]).replace(/[^\d.]/g,''));
          if(code && Number.isFinite(val)) M.set(code,val);
        };
        if(Array.isArray(data)) data.forEach(push); else Object.values(data).forEach(push);
        cache.census=M; Diag.log(`Censo: ${u} ✔ (${M.size} municipios)`);
        break;
      }catch(e){ Diag.log(`Censo: ${u} — ${e.message}`, false); }
    }
  }catch(e){ Diag.log(e.message,false); }
}
loadAll();

/* ===== UI ===== */
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{
  const mode=b.dataset.style;
  if(mode==="poblacion" && cache.census && layers.mpios){
    layers.mpios.setStyle(styleBy(cache.census));
    legend("Población (CNPV 2018)", breaksFrom([...cache.census.values()],6));
  }else{
    if(layers.mpios) layers.mpios.setStyle(baseStyle('#43d17a'));
    if(layers.comunas) layers.comunas.setStyle(baseStyle('#6bd1ff'));
    if(layers.correg) layers.correg.setStyle(baseStyle('#ffe08a'));
    document.getElementById("legend").style.display="none";
  }
});
document.getElementById("toggleComunas").onclick=()=>{ if(!layers.comunas)return; if(map.hasLayer(layers.comunas)) map.removeLayer(layers.comunas); else layers.comunas.addTo(map); };
document.getElementById("toggleCorreg").onclick=()=>{ if(!layers.correg)return; if(map.hasLayer(layers.correg)) map.removeLayer(layers.correg); else layers.correg.addTo(map); };
document.getElementById("toggleMpios").onclick =()=>{ if(!layers.mpios)return;  if(map.hasLayer(layers.mpios))  map.removeLayer(layers.mpios);  else layers.mpios.addTo(map); };
document.getElementById("q").addEventListener("keydown",(e)=>{
  if(e.key!=="Enter") return; const t=e.target.value.trim().toLowerCase(); if(!t) return;
  const hit=(window._idx||[]).find(x=>x.name.toLowerCase().includes(t));
  if(hit&&hit.bounds) map.fitBounds(hit.bounds.pad(0.4));
});
</script>
</body>
</html>
